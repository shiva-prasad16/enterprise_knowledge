<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#f5f7fb"/><rect x="40" y="32" width="1360" height="836" rx="18" fill="white" stroke="#dbe3ef"/><rect x="40" y="32" width="1360" height="72" rx="18" fill="#0b1f3a"/><text x="78" y="78" font-family="Arial" font-size="28" font-weight="700" fill="white">Enterprise Knowledge Copilot</text>
<text x="105" y="168" font-family="Arial" font-size="16" font-weight="700" fill="#64748b">QUESTION</text><rect x="90" y="188" width="1260" height="80" rx="13" fill="#eef6ff"/><text x="120" y="238" font-family="Arial" font-size="23" fill="#0b1f3a">What was the company’s revenue last quarter?</text>
<text x="105" y="325" font-family="Arial" font-size="16" font-weight="700" fill="#64748b">RESPONSE</text><rect x="90" y="345" width="1260" height="250" rx="13" fill="#fffaf0" stroke="#f2cf7d"/><circle cx="147" cy="414" r="28" fill="#f5b942"/><text x="147" y="424" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">!</text><text x="195" y="402" font-family="Arial" font-size="23" font-weight="700" fill="#6b4f00">Not enough information in the uploaded documents</text><text x="195" y="451" font-family="Arial" font-size="19" fill="#50462f">I couldn’t find sufficiently relevant evidence to answer this question.</text><text x="195" y="490" font-family="Arial" font-size="19" fill="#50462f">Try asking about the uploaded policy, handbook, or benefits documents.</text><line x1="195" y1="525" x2="1280" y2="525" stroke="#ead9aa"/><text x="195" y="562" font-family="Arial" font-size="15" fill="#7c6c42">No unsupported citations or model guess were produced.</text>
<rect x="90" y="650" width="1260" height="90" rx="13" fill="#f8fafc" stroke="#dbe3ef"/><text x="120" y="687" font-family="Arial" font-size="15" font-weight="700" fill="#64748b">WHY THIS MATTERS</text><text x="120" y="718" font-family="Arial" font-size="17" fill="#334155">The best available result is not always relevant; backend relevance handling protects answer quality.</text><text x="72" y="850" font-family="Arial" font-size="15" fill="#64748b">Presentation mockup • Unsupported-query fallback</text></svg>
